[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vizier-ai"
version = "0.1.0"
description = "Standalone Python library for generating analytics chart ideas from data"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-ai>=0.0.40",
    "pandas>=2.2.0",
    "aiohttp>=3.9.0",
    "sqlalchemy>=2.0.0",
    "jsonpath-python>=1.1.6",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = []

[tool.setuptools.packages.find]
where = ["."]
include = ["vizier_ai", "vizier_ai.*"]

[tool.setuptools.package-data]
vizier_ai = [
    "ui/frontend/dist/**/*",
    "ui/frontend/dist/assets/**/*",
]

[project.scripts]
vizier-dev = "vizier_ai.ui.scripts:dev"
vizier-dev-backend = "vizier_ai.ui.scripts:backend"
vizier-dev-frontend = "vizier_ai.ui.scripts:frontend"
